# ---- sys.notice.viewFeedbackComplaints (Feedback/Complaint Center) ----
sys.notice.feedback.tab1 = Feedback / Complaint Center:
sys.notice.feedback.tab2 = Guide to Submitting a Complaint / Feedback:
sys.notice.feedback.tab3 = Submit Feedback / Complaint:
sys.notice.feedback.intro.title = Introduction to the Feedback Center:
sys.notice.feedback.intro.p1 = Based on our working principles, the Company is making every effort to protect employees' rights and build a safe, clean, fair, and civilized organizational culture.
sys.notice.feedback.intro.p2 = To meet this goal, we have set up the Feedback/Complaint section so that all employees can send their opinions and matters they need to give feedback on or complain about. The Center is a channel for receiving opinions in order to resolve issues promptly and prevent conduct that does not meet the Company's standards and ethics.
sys.notice.feedback.intro.p3 = We look forward to receiving the attention and cooperation of all our valued employees.
sys.notice.feedback.security.title = Information Confidentiality:
sys.notice.feedback.security.p1 = The Feedback Center prioritizes the confidentiality of information of employees and related individuals in all cases.
sys.notice.feedback.process.title = Handling Process:
sys.notice.feedback.process.p1 = Receive feedback and complaints on matters such as: Working environment, Sexual harassment, Discrimination, Workplace bullying, Insult to honor and dignity, Bribery, abuse of position, etc.
sys.notice.feedback.process.p2 = Investigation: Investigate and verify the facts regarding the feedback/complaint issues
sys.notice.feedback.process.p3 = Resolution: Propose appropriate corrective and preventive measures
sys.notice.feedback.guide.content.title = Content:
sys.notice.feedback.guide.content.p1 = The scope of Feedback/Complaints covers issues such as: sexual harassment in the workplace, workplace bullying, unfairness in management, and other workplace environment issues.
sys.notice.feedback.guide.content.p2 = When submitting feedback/complaints, employees should present the information honestly, clearly and completely, together with supporting documents and images (if any), so the verification and handling process can proceed quickly
sys.notice.feedback.guide.staff.title = Staff in Charge:
sys.notice.feedback.guide.staff.p1 = Employees can contact the following staff in charge directly:
sys.notice.feedback.guide.staff.position1 = HR Manager
sys.notice.feedback.guide.staff.position2 = Director of Administration \u2013 Human Resources
