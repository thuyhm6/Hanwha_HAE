<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
 <head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Approve Info</title>
  <style type="text/css">
	.user_table {border-bottom:1px solid #DEEDF8;border-left:1px solid #DEEDF8;}
	.user_table td{border-right:1px solid #DEEDF8;border-top:1px solid #DEEDF8;}
	.user_photo p {background:url(images/photo/photo.jpg) no-repeat left top;}
	.td_title {background:#F5FBFE;color:#276FA4;font:12px/20px arial,sans-serif;}
	.th_title {border-right:1px solid #DEEDF8;background:#F5FBFE;color:#276FA4;}
	.td_type {color:#333;font:12px/20px arial,sans-serif;}
	.user_table td.td_title {text-align:center;}
	.tablea th {background:url(./images/grid/tableth.png) repeat-x scroll 0 0 #F0EFF0;}
</style>
 </head>
 <body>
   <div style="width:1200px;">
   		
						<table width="100%" border="0" cellpadding="0" cellspacing="0">
							<tr>
								<td style="font:bold 14px/18px arial,sans-serif;text-align:left">
								신청자정보 / Thông tin nhân viên
							     <br>
								</td>
							</tr>
						</table>
						<table class="user_table"  width="60%" border="0" cellpadding="0" cellspacing="0" style="margin-top:15px;">
							<tr>
								<td class="td_title" style="text-align: center;width:20%;"><!-- 姓名 -->
									성명 / Họ tên
								</td>
								<td class="td_title" style="text-align: center;width:20%;"><!-- 工号 -->
									사번 / Mã nhân viên
								</td>
								<td class="td_title" style="text-align: center;width:40%;"><!-- 部门 -->
									부서 / Phòng ban
								</td>
								<td class="td_title" style="text-align: center;width:20%;"><!-- 职级 -->
									직급 / Chức vụ
								</td>
							</tr>
							[APPLY_PERSON_INFO]
						</table>
						<br>
						<table width="100%" border="0" cellpadding="0" cellspacing="0">
							<tr>
								<td style="font:bold 14px/18px arial,sans-serif;text-align:left">
								신청정보 / Thông tin xin phép
							     <br>
								</td>
							</tr>
						</table>
						<table class="user_table"  width="100%" border="0" cellpadding="0" cellspacing="0" style="margin-top:15px;">
							<tr>
								<td class="td_title" style="text-align: center;width:16%;"><!-- 申请类型 -->
									신청유형 / Loại đăng ký
								</td>
								<td class="td_title" style="text-align: center;width:18%;"><!-- 申请开始时间 -->
									신청시작일자 / Thời gian bắt đầu
								</td>
								<td class="td_title" style="text-align: center;width:18%;"><!-- 申请结束时间 -->
									신청마감일자 / Thời gian kết thúc
								</td>
								<td class="td_title" style="text-align: center;width:18%;"><!-- 申请时长 -->
									신청시간수 / Thời lượng
								</td>
								<td class="td_title" style="text-align: center;width:30%;"><!-- 原因 -->
									사유 / Nguyên nhân
								</td>
							</tr>
							[APPAL_ATT_INFO]
						</table>
   </div>
 </body>
</html>
